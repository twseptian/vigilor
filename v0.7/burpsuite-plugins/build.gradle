plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group   = 'com.ensign'
version = '0.7.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://repo.portswigger.net/maven' }
}

dependencies {
    // Burp Suite Montoya API — compile-only, provided by Burp at runtime
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'

    // JSON (shadowed into the plugin JAR)
    implementation 'com.google.code.gson:gson:2.10.1'
}

shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('agentic-pentest-burp')
    mergeServiceFiles()
    // Relocate Gson to avoid conflicts with other extensions
    relocate 'com.google.gson', 'com.ensign.shadow.gson'
}

// Always produce the fat JAR on build
build.dependsOn shadowJar
jar.enabled = false
