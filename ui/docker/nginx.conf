server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Exact /assets is the SPA Assets page; /assets/* are Vite static files.
    # Without this, nginx treats the /assets directory as $uri/ and 301s away from the SPA.
    location = /assets {
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend liveness probe — also lets the UI show the deployed backend version
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API to backend
    # Override Origin so backend CORS always matches regardless of server IP/hostname
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "http://localhost";
    }

    # Proxy WebSocket
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Origin            "http://localhost";
        proxy_read_timeout 3600s;
    }
}
